services:
  bot:
    image: ghcr.io/ghifaryh/agent-discord-harness:latest
    container_name: agent-discord-harness
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
