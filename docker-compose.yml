services:
  bot:
    image: ghcr.io/ghifaryh/agent-discord-harness:latest
    container_name: agent-discord-harness
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${WEBHOOK_PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
